<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #e8eefc, #f6f8fb); min-height: 100vh; }
    .card { border: 0; border-radius: 16px; overflow: hidden; }
    .card-header { background: #2c5282; color: #fff; padding: 1.2rem 1.5rem; }
    .form-control { border-radius: 8px; padding: .6rem .8rem; }
    .form-control:focus { box-shadow: 0 0 0 .2rem rgba(44, 82, 130, .2); border-color: #2c5282; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width: 760px;">
  <div class="card shadow">
    <div class="card-header">
      <h4 class="mb-0">Student Registration</h4>
      <small class="opacity-75">Fill in all the fields below</small>
    </div>
    <div class="card-body p-4">
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <div class="row g-3">
          {% for field in form %}
          <div class="{% if field.name == 'address' %}col-12{% else %}col-md-6{% endif %}">
            <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <div class="text-danger small mt-1">{{ error }}</div>
            {% endfor %}
          </div>
          {% endfor %}
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary px-4">Save</button>
          <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">View Students</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
