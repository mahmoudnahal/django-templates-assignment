<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Students</h3>
    <a href="{% url 'student_add' %}" class="btn btn-success">+ Add New Student</a>
  </div>
  <table class="table table-striped table-bordered align-middle bg-white">
    <thead class="table-dark">
      <tr>
        <th>Name</th><th>University ID</th><th>National ID</th>
        <th>Mobile Number</th><th>Address</th><th>Date of Birth</th><th>Image</th>
      </tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.university_id }}</td>
        <td>{{ s.id_number }}</td>
        <td>{{ s.mobile }}</td>
        <td>{{ s.address }}</td>
        <td>{{ s.date_of_birth|date:"d M Y" }}</td>
        <td><img src="{{ s.image.url }}" width="60" height="60" class="rounded" style="object-fit: cover;"></td>
      </tr>
      {% empty %}
      <tr><td colspan="7" class="text-center">No students yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
